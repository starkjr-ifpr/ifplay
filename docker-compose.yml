services:
  postgres:
    image: postgres:16-alpine
    container_name: ifplay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ifplay
      POSTGRES_PASSWORD: ifplay
      POSTGRES_DB: ifplay
    volumes:
      - ifplay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifplay -d ifplay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ifplay_postgres_data:
